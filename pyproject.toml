[project]
name = "eipo"
version = "0.1.0"
description = "EIPO baselines; uv-managed deps for the continuous-control port (continuous/). The legacy rlpyt/Atari code is NOT covered by these dependencies."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "gymnasium[mujoco]>=1.1",
    "gymnasium-robotics>=1.3",
    "numpy",
    "tensorboard",
]

[tool.uv]
# Dependency-management only: never try to build/install this repo as a package.
package = false
